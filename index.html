<script>
// One file, three layouts: ?versao=celular|tablet|computador, else the last choice, else guessed from the device
(() => {
  const ok = ['computador', 'celular', 'tablet'];
  let v = new URLSearchParams(location.search).get('versao');
  try { if (ok.includes(v)) localStorage.setItem('othelo-franco-layout', v); else v = localStorage.getItem('othelo-franco-layout'); } catch (e) {}
  if (!ok.includes(v)) {
    const touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
    const small = Math.min(screen.width, screen.height) < 600;
    v = !touch ? 'computador' : small ? 'celular' : 'tablet';
  }
  window.__LAYOUT = v; window.__TOUCH_NOMINI = v === 'celular';
  document.write(TEMPLATES[v]);
})();
</script>

const GARDEN=0, HALL=1, ROOM=2, OFFICE=3, BATH=4, WALL=5, DOOR=6, WIN=7, GAP=8, DESK=9, STAIR=10, ELEV=11, OBJ=12, ROAD=13, WALK=14, OUT=15, BUSH=16, EARTH=17, EXT=18, EXIT=19, TABLE=20, KITCHEN=21, PC=22, GRASS=23, PAVE=24, ASPH=25, PLAZA=26, ROOF=27, BLACK=28, FENCE=29, YEXIT=30, COURT=31, TENT=32, STEP=33, SAND=34;

// A floor of the building: its own tile grid, rooms, doors and interaction points
function makeLevel(id, name, cols, rows, fill) {
  const L = {id, name, cols, rows, grid: Array.from({length: rows}, () => Array(cols).fill(fill)),
             rooms: [], doors: [], doorAt: {}, points: [], spots: {}, labels: [], decor: () => {}, furn: [], block: new Set()};
  L.set = (x,y,t) => { if (x>=0&&y>=0&&x<cols&&y<rows) L.grid[y][x]=t; };
  L.rect = (x0,y0,x1,y1,t) => { for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) L.set(x,y,t); };
  L.carve = rooms => { for (const r of rooms) { L.rooms.push(r); const [x0,y0,x1,y1]=r.r; L.rect(x0+1,y0+1,x1-1,y1-1,r.f); } };
  L.door = (room, tiles, assumed) => { const d = {room, tiles, open:false, assumed}; L.doors.push(d); for (const [x,y] of tiles) { L.set(x,y,DOOR); L.doorAt[y*cols+x] = d; } };
  L.vdoor = (x,y,room,a) => L.door(room, [[x,y],[x,y+1]], a);
  L.hdoor = (x,y,room,a) => L.door(room, [[x,y],[x+1,y]], a);
  return L;
}

window.__resizeGame = (w, h) => { cv.width = VW = Math.max(240, w); cv.height = VH = Math.max(200, h); };
const C = {garden:'#4f7d43', bush:'#2f5a33', hall:'#cfd3d6', hall2:'#c4c8cc', room:'#d8b98a', room2:'#cfae7f', office:'#e2d8c6', bath:'#bcd6df', bath2:'#aecbd5', kitchen:'#e6e8e3', kitchen2:'#d9dcd6', wall:'#3e4657', road:'#393b41', walk:'#a8a398', out:'#bdb6a6', desk:'#8a5a32', stair:'#9aa1ab', elev:'#6d7480', obj:'#b9925a', earth:'#3a2f26', ext:'#5b8a4c', grass:'#5f9150', grass2:'#5a8a4b', pave:'#c9c3b5', pave2:'#c1bbac', asph:'#4a4d53', plaza:'#b8ad98', roof:'#8c8f96', black:'#16181c', fence:'#5d4b3a', court:'#c8734a', tent:'#d8d2c4', step:'#b59f86', door:'#2f63c4', gap:'#f2c94c', win:'#3fae5a', exit:'#d8453b'};

function floorColor(t, x, y) {
  const odd = (x+y)%2===0;
  switch (t) {
    case HALL: case GAP: case DOOR: case STAIR: case ELEV: case OBJ: case TABLE: return odd ? C.hall : C.hall2;
    case ROOM: case DESK: return y%2 ? C.room : C.room2;
    case OFFICE: return C.office;
    case BATH: return odd ? C.bath : C.bath2;
    case KITCHEN: return odd ? C.kitchen : C.kitchen2;
    case OUT: return C.out;
    case WALK: return C.walk;
    case ROAD: return C.road;
    case EARTH: return C.earth;
    case EXT: return C.ext;
    case GRASS: case BUSH: return (x*7+y*13)%5===0 ? C.grass2 : C.grass;
    case PAVE: return odd ? C.pave : C.pave2;
    case ASPH: return C.asph;
    case PLAZA: return C.plaza;
    case ROOF: return C.roof;
    case BLACK: return C.black;
    case FENCE: return C.fence;
    case COURT: return C.court;
    case TENT: return C.tent;
    case STEP: return C.step;
    case SAND: return (x*5+y*3)%4===0 ? '#e0c98f' : '#e6d29c';
    case YEXIT: return C.gap;
    default: return C.garden;
  }
}
const wallish = (L,x,y) => { const t = L.grid[y]?.[x]; return t===WALL||t===WIN||t===GAP||t===EXIT||t===DOOR||t===ROOF||t===FENCE; };

function elevator(bg, x, y, w, h) {
  bg.fillStyle=C.elev; bg.fillRect((x+1)*TS,(y+1)*TS,(w-2)*TS,(h-1)*TS);
  bg.fillStyle='#4b515c'; bg.fillRect((x+1)*TS,(y+1)*TS,(w-2)*TS/2-2,6); bg.fillRect((x+1)*TS+(w-2)*TS/2+2,(y+1)*TS,(w-2)*TS/2-2,6);
}

function drawStatic(L) {
  if (!L.bg) { L.bg = document.createElement('canvas'); L.bg.width = L.cols*TS; L.bg.height = L.rows*TS;
               L.ms = Math.min(MS, 170/(L.cols*TS)); L.mini = document.createElement('canvas'); L.mini.width = Math.round(L.cols*TS*L.ms); L.mini.height = Math.round(L.rows*TS*L.ms); }
  const bg = L.bg.getContext('2d'), G = L.grid;
  for (let y=0;y<L.rows;y++) for (let x=0;x<L.cols;x++) {
    const t = G[y][x], px=x*TS, py=y*TS;
    const vert = wallish(L,x,y-1) && wallish(L,x,y+1);
    bg.fillStyle = (t===WALL||t===WIN||t===EXIT) ? C.wall : floorColor(t,x,y);
    if (t===EXIT && L.id==='fora') bg.fillStyle = C.roof;
    if (t===OBJ && L.id==='fora') bg.fillStyle = '#e6d29c';
    bg.fillRect(px,py,TS,TS);
    if (t===BUSH) { bg.fillStyle=C.bush; bg.beginPath(); bg.arc(px+12,py+12,10,0,7); bg.fill(); bg.fillStyle='#3d7343'; bg.beginPath(); bg.arc(px+9,py+9,5,0,7); bg.fill(); }
    else if (t===DESK) { bg.fillStyle=C.desk; bg.fillRect(px+3,py+5,TS-6,TS-10); }
    else if (t===PC) { bg.fillStyle='#9aa0a8'; bg.fillRect(px+1,py+1,TS-2,TS-2); bg.fillStyle='#1d2430'; bg.fillRect(px+4,py+4,TS-8,TS-11); bg.fillStyle='#4aa3df'; bg.fillRect(px+6,py+6,TS-12,TS-15); }
    else if (t===STAIR) { bg.fillStyle=C.stair; bg.fillRect(px,py,TS,TS); bg.fillStyle='rgba(0,0,0,.25)'; bg.fillRect(px+(x%2?TS-3:0),py,3,TS); }
    else if (t===GAP) { bg.fillStyle=C.gap; for (let i=0;i<TS;i+=8) vert ? bg.fillRect(px+TS/2-3, py+i, 6, 5) : bg.fillRect(px+i, py+TS/2-3, 5, 6); }
    else if (t===WIN || t===EXIT) {
      bg.fillStyle = t===WIN ? C.win : C.exit;
      vert ? bg.fillRect(px+6,py,12,TS) : bg.fillRect(px,py+6,TS,12);
      bg.fillStyle='rgba(255,255,255,.5)'; vert ? bg.fillRect(px+11,py+2,2,TS-4) : bg.fillRect(px+2,py+11,TS-4,2);
    }
    if (t===ROAD && x===67 && y%3===0) { bg.fillStyle='#e8e2c9'; bg.fillRect(px+10,py+4,4,26); }
  }
  // Térreo: what is outside the walls is copied from the outside level, 1:1 (inside x,y = outside x+71-GX, y+23)
  if (L === DOWN) for (let y=0;y<L.rows;y++) for (let x=0;x<L.cols;x++) if (G[y][x]===EXT || G[y][x]===EARTH)
    bg.drawImage(FORA.bg, (x+71-GX)*TS, (y+23)*TS, TS, TS, x*TS, y*TS, TS, TS);
  L.decor(bg);
  drawFurn(L, bg);
  for (const id of ORDER) {
    const r = L.rooms.find(r => r.id===id); if (!r || state.unlocked[id]) continue;
    const [x0,y0,x1,y1]=r.r;
    bg.fillStyle='rgba(10,14,22,.6)'; bg.fillRect((x0+1)*TS,(y0+1)*TS,(x1-x0-1)*TS,(y1-y0-1)*TS);
    lockIcon(bg, ((x0+x1+1)/2)*TS, ((y0+y1+1)/2)*TS + 22);
  }
  bg.textAlign='center'; bg.textBaseline='middle';
  for (const r of L.rooms) {
    const txt = r.lab ?? r.name; if (!txt) continue;
    const [x0,y0,x1,y1]=r.r, at = L.labelAt[r.id];
    label(bg, txt, at ? at[0]*TS : ((x0+x1+1)/2)*TS, at ? at[1]*TS : ((y0+y1+1)/2)*TS, (x1-x0) < 7 ? 11 : 14);
  }
  for (const [txt,x,y,s] of L.labels) label(bg, txt, x*TS, y*TS, s);
  const m = L.mini.getContext('2d'); m.drawImage(L.bg, 0, 0, L.mini.width, L.mini.height);
}
const drawAll = () => [FORA, UP, DOWN].forEach(drawStatic); // fora first: the térreo shows its surroundings
function label(bg, txt, x, y, size) {
  bg.font=`700 ${size}px "Pixelify Sans", monospace`;
  const w = bg.measureText(txt).width + 10, h = size + 8;
  bg.fillStyle='rgba(16,21,30,.8)'; bg.fillRect(x-w/2, y-h/2, w, h);
  bg.fillStyle='#eef1f6'; bg.fillText(txt, x, y+1);
}
function lockIcon(bg, x, y) {
  bg.strokeStyle='#f2c14e'; bg.lineWidth=4; bg.beginPath(); bg.arc(x, y-10, 9, Math.PI, 0); bg.stroke();
  bg.fillStyle='#f2c14e'; bg.fillRect(x-13, y-10, 26, 20);
  bg.fillStyle='#1d1d1d'; bg.fillRect(x-2, y-5, 4, 9);
}

// ---------- Player ----------
const player = {x:START.x, y:START.y, step:0};
const HB = 7;
const keys = {};
let mode = 'walk', near = null, t0 = performance.now(), clock = 0, showMini = !window.__TOUCH_NOMINI;
window.__gameMode = () => mode; window.__toggleMini = () => { showMini = !showMini; };
const hitboxTiles = (px, py) => [[px-HB,py-HB],[px+HB,py-HB],[px-HB,py+HB],[px+HB,py+HB]].map(([a,b]) => [Math.floor(a/TS), Math.floor(b/TS)]);

function move(dx, dy) {
  const free = (nx, ny) => hitboxTiles(nx, ny).every(([tx,ty]) => !isSolid(tx,ty));
  if (dx && free(player.x+dx, player.y)) player.x += dx;
  if (dy && free(player.x, player.y+dy)) player.y += dy;
}

function currentArea() {
  const tx = player.x/TS, ty = player.y/TS;
  const inside = level.rooms.filter(r => tx>=r.r[0]+1 && tx<r.r[2] && ty>=r.r[1]+1 && ty<r.r[3]);
  const r = inside.find(r => !r.hall) || inside.find(r => !r.big) || inside[0];
  if (r) return r.name;
  return level.outside(tx) || 'Corredor';
}

function findNear() {
  const px = player.x/TS, py = player.y/TS;
  let best = null, bd = 1e9;
  const consider = (obj, cx, cy, r) => { const d = Math.hypot(px-cx, py-cy); if (d < r && d < bd) { bd = d; best = obj; } };
  for (const p of level.points) if (!(p.hide && p.hide())) { const q = p.dyn ? p.dyn() : p.pos; if (q) consider(p, q[0], q[1], p.r); }
  if (state.gal >= 2 && level.id === 'baixo') consider({kind:'gal', label:'E: falar com a professora Gal'}, G(8.5), 125.8, 2.2);
  if (state.gal === 3) for (const it of ITENS) if (!state.itens[it.id] && it.lv === level.id) consider({kind:'item', it, label:`E: pegar ${it.art} ${it.name}`}, it.pos[0], it.pos[1], 1.6);
  if (lunch && level.id === 'baixo') lunchNear(consider);
  if (state.fim === 'envelopes') for (const e of ENVELOPES) if (!state.env[e.id] && e.lv === level.id) consider({kind:'envelope', e, label:'E: pegar o envelope'}, e.pos[0], e.pos[1], 1.6);
  if (state.cad === 2 && level.id === 'baixo') for (const t of FREE_TABLES) consider({kind:'mesa', t, label:'E: lanchar nesta mesa'}, t[0], t[1], 2);
  if (state.caderno === 1 && state.cadernoPos && state.cadernoPos.lv === level.id) consider({kind:'caderno', label:'E: pegar o caderno'}, state.cadernoPos.x, state.cadernoPos.y, 1.3);

  // Standing next to any step of the stairs also works
  const tx = Math.floor(px), ty = Math.floor(py);
  for (let y=ty-1;y<=ty+1;y++) for (let x=tx-1;x<=tx+1;x++) if (level.grid[y]?.[x]===STAIR && !(level.noStair && level.block.has(y*level.cols+x))) { consider(level.stairGo, px+1.2, py, 2); y=ty+2; break; }
  for (const id of ORDER) if (state.unlocked[id] && level.spots[id]) consider({kind:'game', id}, level.spots[id][0]+0.5, level.spots[id][1], 1.6);
  for (const d of level.doors) {
    const cx = d.tiles.reduce((s,t)=>s+t[0]+0.5,0)/2, cy = d.tiles.reduce((s,t)=>s+t[1]+0.5,0)/2;
    consider({kind:'door', d}, cx, cy, 1.7);
  }
  // The classmate only answers when nothing else is in reach
  if (!best && following()) { const c = companionPos(); consider({kind:'companion', label: followerKind() === 'cad' ? 'E: falar com o estudante' : 'E: falar com a colega'}, c.x/TS, c.y/TS, 2.4); }
  if (!best) ambNear(consider);
  return best;
}

function drawPerson(x, y, shirt, moving, hair, skin, ph) {
  const bob = moving ? Math.sin((ph === undefined ? player.step : ph)*10)*1.5 : 0;
  ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, y+9, 9, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle='#24345c'; ctx.fillRect(x-6, y+2+bob, 12, 7);
  ctx.fillStyle=shirt; ctx.fillRect(x-7, y-6+bob, 14, 10);
  ctx.fillStyle='#2b5fb4'; ctx.fillRect(x-7, y-1+bob, 14, 2);
  if (hair === 'long') { ctx.fillStyle='#2a1c14'; ctx.fillRect(x-7, y-13+bob, 14, 11); }
  ctx.fillStyle=skin || '#c98d62'; ctx.beginPath(); ctx.arc(x, y-10+bob, 6, 0, 7); ctx.fill();
  ctx.fillStyle='#2a1c14'; ctx.beginPath(); ctx.arc(x, y-12+bob, 6, Math.PI, 0); ctx.fill();
}

function drawDoor(d) {
  const vert = d.tiles[0][0] === d.tiles[1][0];
  const [x0,y0] = d.tiles[0], px=x0*TS, py=y0*TS;
  ctx.fillStyle = C.door;
  if (!d.open) {
    vert ? ctx.fillRect(px+5, py+1, TS-10, 2*TS-2) : ctx.fillRect(px+1, py+5, 2*TS-2, TS-10);
    ctx.fillStyle = '#c9d6f2'; vert ? ctx.fillRect(px+TS/2-2, py+TS-4, 4, 8) : ctx.fillRect(px+TS-4, py+TS/2-2, 8, 4);
    if (isLocked(d)) { ctx.fillStyle='#f2c14e'; ctx.fillRect(px + (vert?TS/2-4:TS-4), py + (vert?TS-4:TS/2-4), 8, 8); }
  } else {
    vert ? ctx.fillRect(px+1, py, 4, 6) : ctx.fillRect(px, py+1, 6, 4);
    vert ? ctx.fillRect(px+1, py+2*TS-6, 4, 6) : ctx.fillRect(px+2*TS-6, py+1, 6, 4);
  }
}

function drawSpot(id) {
  const [sx, sy] = level.spots[id], x=(sx+0.5)*TS, y=sy*TS;
  if (state.done[id]) {
    ctx.fillStyle='#6cc28a'; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill();
    ctx.strokeStyle='#10261a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-4,y); ctx.lineTo(x-1,y+4); ctx.lineTo(x+5,y-4); ctx.stroke();
    return;
  }
  const p = 1 + Math.sin(clock*4)*0.15;
  ctx.fillStyle='rgba(242,193,78,.25)'; ctx.beginPath(); ctx.arc(x,y,16*p,0,7); ctx.fill();
  ctx.fillStyle='#f2c14e'; ctx.beginPath();
  for (let i=0;i<10;i++) { const r = i%2?4:9, a = -Math.PI/2 + i*Math.PI/5; ctx.lineTo(x+Math.cos(a)*r*p, y+Math.sin(a)*r*p); }
  ctx.fill();
}

function bubble(txt, x, y) {   // screen coordinates
  ctx.font='700 13px "Pixelify Sans", monospace';
  const w = ctx.measureText(txt).width + 14;
  ctx.fillStyle='#f2c14e'; ctx.fillRect(x-w/2, y-11, w, 22);
  ctx.fillStyle='#1d1d1d'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt, x, y+1);
}

function talkSec() {

function matricula() {
  mode = 'form'; ov.onclick = null;
  const series = ['1º ano','2º ano','3º ano','4º ano','5º ano','6º ano','7º ano','8º ano','9º ano'];
  ov.innerHTML = `<form class="box" id="fm" autocomplete="off">
    <h2>Secretaria</h2>
    <p>Bom dia! Primeiro dia no Othelo Franco? Preciso de alguns dados para a sua matrícula.</p>
    <label class="field">Nome completo<input id="fNome" required maxlength="60" placeholder="Ex.: Ana Beatriz Souza"></label>
    <div class="row2">
      <label class="field">Idade<input id="fIdade" type="number" required min="5" max="17" value="11"></label>
      <label class="field">Série<select id="fSerie">${series.map(x => `<option${x==='6º ano'?' selected':''}>${x}</option>`).join('')}</select></label>
    </div>
    <p class="err" id="fErr" hidden>Escreva o nome e o sobrenome.</p>
    <div class="row2"><button type="submit" class="primary">Fazer matrícula</button><button type="button" id="fCancel">Agora não</button></div>

  ov.hidden = false;

function startDraw() {

function paintStroke(c, k) {
  c.lineWidth = 4; c.lineJoin = c.lineCap = 'round'; c.strokeStyle = k.c;
  c.beginPath();
  if (k.t === 'line') { k.p.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y)); c.stroke(); return; }
  if (k.t === 'circ') c.arc(k.x, k.y, k.r, k.a0, k.a1);
  else if (k.t === 'arc') c.arc(k.x, k.y, k.r, k.a0, k.a1);
  else if (k.t === 'ell') c.ellipse(k.x, k.y, k.rx, k.ry, 0, 0, 7);
  else if (k.t === 'poly') { k.p.forEach(([x,y],i) => i ? c.lineTo(x,y) : c.moveTo(x,y)); c.closePath(); }
  if (k.fill) { c.fillStyle = k.fill; c.fill(); }
  c.stroke();
}
function showDrawing() {
  const d = dq.list[dq.i];
  if (!dq.opts) dq.opts = shuffle([d.name, ...shuffle(DRAWINGS.filter(x => x !== d).map(x => x.name)).slice(0,3)]);

  const c = $('drw').getContext('2d');

function classRoute(i) {

let classWalk = null;   // null: still in the art room (or already seated, see classArrived)

function startClassWalk() {
  classWalk = CLASS_LOOK.map(([shirt,hair], i) => ({shirt, hair, route: classRoute(i), seg:0, pt:1, delay: i*1.6, lv:'baixo', x:G(ART_SEATS[i][0])-GX+GX, y:ART_SEATS[i][1], wait:0, done:false}))
    .map(w => (w.x = w.route[0].pts[0][0], w));
  for (const L of Object.values(LEVELS)) for (const d of L.doors) if (d.room === 'artes' || d.room === 'sala7') d.open = true;
}
function updateClassWalk(dt) {
  if (!classWalk) return;
  const SPEED = 3; // tiles per second, the player walks at 6.25
  for (const w of classWalk) {
    if (w.done) continue;
    if (w.delay > 0) { w.delay -= dt; continue; }
    const seg = w.route[w.seg];
    if (seg.wait !== undefined) { w.lv = null; w.wait += dt; if (w.wait >= seg.wait) { w.seg++; w.pt = 1; const n = w.route[w.seg]; w.lv = n.lv; [w.x, w.y] = n.pts[0]; } continue; }
    const [tx, ty] = seg.pts[w.pt], dx = tx - w.x, dy = ty - w.y, d = Math.hypot(dx, dy), stp = SPEED*dt;
    w.moving = true;
    if (d <= stp) { w.x = tx; w.y = ty; w.pt++; if (w.pt >= seg.pts.length) { if (w.seg === w.route.length-1) { w.done = true; w.moving = false; } else { w.seg++; w.wait = 0; } } }
    else { w.x += dx/d*stp; w.y += dy/d*stp; }
  }
  if (classWalk.every(w => w.done)) classWalk = null;
}

  for (const L of Object.values(LEVELS)) for (const r of L.rooms) if (CADERNO_ROOMS.includes(r.id)) {
    const [x0,y0,x1,y1] = r.r;
    for (let y=y0+1;y<y1;y++) for (let x=x0+1;x<x1;x++) {
      const t = L.grid[y][x];
      if (!SOLID.has(t) && !L.block.has(y*L.cols+x) && t !== DOOR && !L.doors.some(d => d.tiles.some(([dx,dy]) => Math.abs(dx-x)+Math.abs(dy-y) < 3))) spots.push({lv:L.id, x:x+0.5, y:y+0.5});
    }
  }
  return spots[Math.floor(Math.random()*spots.length)];
}

// 3) Ping-pong in the tenda: score 3 points
const PW = 300, PH = 420, PAD_W = 60, PAD_H = 10, BALL_R = 6;
let pg = null;
function talkPong() {
  if (state.pongDone) return say('Tenda', '— Revanche depois da aula? Você joga muito!');
  talk('Tenda', '— Ei! Quer jogar ping-pong? Faça <b>3 pontos</b> contra mim!\nUse A e D (ou ← e →) para mexer a raquete.', startPong);
}
function startPong() {
  mode = 'pong'; ov.onclick = null;
  ov.innerHTML = `<div class="box"><h2>Ping-pong na tenda</h2><p id="pgScore"></p><canvas id="pgc" width="${PW}" height="${PH}" class="paper pong"></canvas><p class="hint">A/D ou ←/→: mexer a raquete · Esc: sair</p></div>`;
  ov.hidden = false;
  pg = {ctx: $('pgc').getContext('2d'), me: PW/2, cpu: PW/2, you:0, them:0, wait: 0.8};
  serve(1);
}
function serve(dir) {
  const a = (Math.random()*0.8 - 0.4);
  pg.ball = {x: PW/2, y: PH/2, vx: Math.sin(a)*230, vy: dir*Math.cos(a)*230}; pg.wait = 0.8;
}
function pongUpdate(dt) {
  const b = pg.ball, mv = (keys.d?1:0) - (keys.a?1:0);
  pg.me = Math.max(PAD_W/2, Math.min(PW-PAD_W/2, pg.me + mv*330*dt));
  // the classmate follows the ball, but not perfectly
  const target = b.vy < 0 ? b.x : PW/2;
  pg.cpu += Math.max(-130*dt, Math.min(130*dt, target - pg.cpu));
  if (pg.wait > 0) { pg.wait -= dt; return drawPong(); }
  b.x += b.vx*dt; b.y += b.vy*dt;
  if (b.x < BALL_R || b.x > PW-BALL_R) { b.vx = -b.vx; b.x = Math.max(BALL_R, Math.min(PW-BALL_R, b.x)); }
  const hit = (px, py, down) => {
    if (Math.abs(b.x - px) > PAD_W/2 + BALL_R) return false;
    if (down ? (b.y + BALL_R >= py && b.y < py + PAD_H && b.vy > 0) : (b.y - BALL_R <= py + PAD_H && b.y > py && b.vy < 0)) {
      const sp = Math.min(430, Math.hypot(b.vx, b.vy) * 1.06), off = (b.x - px) / (PAD_W/2);
      b.vx = off * sp * 0.75; b.vy = (down ? -1 : 1) * Math.sqrt(Math.max(sp*sp - b.vx*b.vx, (sp*0.5)**2)); return true;
    }
    return false;
  };
  hit(pg.me, PH - 30, true); hit(pg.cpu, 20, false);
  if (b.y < -BALL_R) { pg.you++; if (pg.you >= 3) return finishPong(); serve(1); }
  if (b.y > PH + BALL_R) { pg.them++; serve(-1); }
  drawPong();
}
function drawPong() {
  const c = pg.ctx;
  c.fillStyle = '#1d5f8a'; c.fillRect(0,0,PW,PH);
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(4,4,PW-8,PH-8);
  c.beginPath(); c.moveTo(PW/2,4); c.lineTo(PW/2,PH-4); c.lineWidth = 1; c.stroke();
  c.fillStyle = '#e5e7e9'; c.fillRect(0, PH/2-3, PW, 6);
  c.fillStyle = '#c0392b'; c.fillRect(pg.me - PAD_W/2, PH-30, PAD_W, PAD_H);
  c.fillStyle = '#f5b041'; c.fillRect(pg.cpu - PAD_W/2, 20, PAD_W, PAD_H);
  c.fillStyle = '#fdfefe'; c.beginPath(); c.arc(pg.ball.x, pg.ball.y, BALL_R, 0, 7); c.fill();
  $('pgScore').textContent = `Seus pontos: ${pg.you} de 3 · Pontos do colega: ${pg.them}`;
}
function quitPong() { pg = null; ov.hidden = true; mode = 'walk'; }
function finishPong() {
  pg = null; state.pongDone = true;
  talk('Tenda', '— Três pontos! Você joga muito bem, hein?\n(A turma da tenda aplaude.)', missionDone);
}

    c.font = '700 12px "Pixelify Sans", monospace'; c.fillStyle = '#3b2a1a'; c.textAlign = 'center'; c.fillText('linha de fundo', 482, FLOOR+28);

    const w = sp.wind; c.fillText(`Vento: ${w === 0 ? 'calmo' : (w > 0 ? '→ ' : '← ') + Math.abs(w)}`, 470, 24);

  // shooter
  const sx = sp.x0, sy = id==='volei' ? 212 : FLOOR - 24; // volleyball: jump serve
  c.fillStyle = '#24345c'; c.fillRect(sx-24,sy+6,12,18); c.fillStyle = '#f4f4f4'; c.fillRect(sx-26,sy-16,16,22); c.fillStyle = '#2b5fb4'; c.fillRect(sx-26,sy-9,16,3);
  c.fillStyle = '#c98d62'; c.beginPath(); c.arc(sx-18,sy-24,8,0,7); c.fill(); c.fillStyle = '#2a1c14'; c.beginPath(); c.arc(sx-18,sy-27,8,Math.PI,0); c.fill();

const QUIZ = [
  {q:'Qual é o bairro da nossa escola?', right:'Tatuapé', wrong:['Carrão','Vila Formosa','Belém','Água Rasa'],
   ok:'Isso! O Othelo Franco fica no Tatuapé, na zona leste de São Paulo.'},
  {q:'A nossa escola é...', right:'Municipal', wrong:['Federal','Estadual','Particular'],
   ok:'Certo! É uma EMEF, uma Escola Municipal de Ensino Fundamental, da Prefeitura de São Paulo.'},
  {q:'Na escola, o estudante deve...', right:'Aprender e cultivar amizades', wrong:['Aprender e brigar','Faltar e cultivar amizades','Faltar e brigar'],
   ok:'Exatamente! Escola é lugar de aprender e de fazer amigos.'},
];
let quiz = null;
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
function talkProfs() {
  if (!state.met.cleusa) return say('Professores', 'Bom dia! Esta é a sala dos professores. É aqui que a gente prepara as aulas, corrige as atividades e toma um cafezinho entre uma turma e outra.');
  if (state.quizDone) return say('Professores', 'Muito bem! Agora fale de novo com a coordenadora Cleusa.');
  showDialog('Professores', `<p>Ah, você trouxe o papel de matrícula! Obrigado, ${firstName()}.</p><p>Antes de você ir, que tal um quiz rápido sobre a escola e o bairro? São 3 perguntas.</p>`, () => { quiz = {i:0, msg:'', set:QUIZ, who:'Professores', done:finishProfsQuiz}; showQuestion(); });
}
function showQuestion() {
  const Q = quiz.set[quiz.i];
  quiz.opts = shuffle([Q.right, ...Q.wrong]);
  mode = 'quiz'; ov.onclick = null;
  ov.innerHTML = `<div class="box"><h2>Pergunta ${quiz.i+1} de ${quiz.set.length}</h2><p>${Q.q}</p>
    <div class="opts">${quiz.opts.map((o,i) => `<button type="button" class="opt" data-i="${i}"><kbd>${i+1}</kbd> ${o}</button>`).join('')}</div>
    <p class="${quiz.msg ? 'err' : 'hint'}">${quiz.msg || 'Clique na resposta ou aperte o número dela.'}</p></div>`;
  ov.hidden = false;
  ov.querySelectorAll('.opt').forEach(b => b.onclick = e => { e.stopPropagation(); answer(+b.dataset.i); });
}
function answer(i) {
  const Q = quiz.set[quiz.i];
  if (quiz.opts[i] !== Q.right) { quiz.msg = 'Hmm, não é bem isso. Tente de novo!'; return showQuestion(); }
  quiz.i++; quiz.msg = '';
  if (quiz.i < quiz.set.length) return showDialog(quiz.who, `<p>${Q.ok}</p>`, showQuestion);
  const done = quiz.done; quiz = null; done(Q);
}
function finishProfsQuiz(Q) {
  state.quizDone = true; save(); updateHud();
  showDialog('Professores', `<p>${Q.ok}</p><p>Você acertou as 3 perguntas! Agora volte e fale de novo com a <b>coordenadora Cleusa</b>, na coordenação.</p>`);
}

function toggleDoor(d) {
  if (isLocked(d)) return say(roomName(d.room), d.room==='entrada' ? 'A porta da escola está trancada. Fale com a secretaria pela janela ao lado.' : 'A porta está trancada.');
  if (d.open && hitboxTiles(player.x, player.y).some(([tx,ty]) => d.tiles.some(([x,y]) => x===tx && y===ty))) return;
  d.open = !d.open;
}

function goTo(id, at) {
  level = LEVELS[id]; player.x = at[0]*TS; player.y = at[1]*TS; trail.length = 0;

}

function startGame(id) {
  const g = GAMES[id];
  mode = 'mini'; ov.onclick = null;
  mg = {id, g, pos:0, dirn:1, hits:0, zone:newZone(g)};
  ov.innerHTML = `<div class="box"><h2>${roomName(id)}: ${g.title}</h2><p>${g.text}</p>

    <div class="dots" id="dots"><i></i><i></i><i></i></div>
    <p class="hint">Acerte 3 vezes. Errar tira um acerto. Esc para sair.</p></div>`;

}
function newZone(g) { const c = 0.15 + rnd()*0.7; return [c - g.zone/2, c + g.zone/2]; }
function renderMini() {
  const z = $('zone'); if (!z || !mg) return;
  z.style.left = (mg.zone[0]*100)+'%'; z.style.width = ((mg.zone[1]-mg.zone[0])*100)+'%';
  $('needle').style.left = (mg.pos*100)+'%';
  [...$('dots').children].forEach((d,i) => d.classList.toggle('on', i < mg.hits));
}
function hitMini() {
  if (mg.pos >= mg.zone[0] && mg.pos <= mg.zone[1]) {
    mg.hits++; mg.zone = newZone(mg.g);
    if (mg.hits >= 3) return winMini();
  } else {
    mg.hits = Math.max(0, mg.hits-1);
    const b = $('bar'); b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss');
  }
  renderMini();
}
function winMini() {
  const id = mg.id; mg = null;
  state.done[id] = true;
  const next = ORDER[ORDER.indexOf(id)+1];
  if (next) state.unlocked[next] = true;
  save(); drawAll(); updateHud();
  showDialog('Aula concluída!', next ? `<p>Próxima aula liberada: <b>${roomName(next)}</b>.</p>` : `<p>Você completou todas as aulas do andar de cima.</p>`);
}
function quitMini() { mg = null; ov.hidden = true; mode = 'walk'; }

const map = {w:'w',arrowup:'w',a:'a',arrowleft:'a',s:'s',arrowdown:'s',d:'d',arrowright:'d'};
addEventListener('keydown', e => {
  if (mode === 'form') { if (e.key === 'Escape') { ov.hidden = true; mode = 'walk'; } return; }
  if (mode === 'word') { if (e.key === 'Escape') quitWords(); return; }
  if (mode === 'mol') { molKey(e); return; }
  if (mode === 'mapa') { if (e.key === 'Escape') quitMapa(); return; }
  if (mode === 'color') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) answerColor(n-1); else if (e.key === 'Escape') quitColors(); return; }
  if (mode === 'choice') { const n = parseInt(e.key, 10); if (n >= 1 && n <= choiceOpts.length) pickChoice(n-1); return; }
  if (mode === 'pong' && e.key === 'Escape') { quitPong(); return; }
  if (mode === 'fig') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) answerFigure(n-1); else if (e.key === 'Escape') quitFigures(); return; }
  if (mode === 'draw') { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) guessDrawing(n-1); else if (e.key === 'Escape') quitDraw(); return; }
  if (mode === 'quiz') { const n = parseInt(e.key, 10); if (n >= 1 && n <= quiz.opts.length) answer(n-1); else if (e.key === 'Escape') { quiz = null; ov.hidden = true; mode = 'walk'; } return; }
  const k = e.key.toLowerCase();
  if (map[k]) { keys[map[k]] = true; e.preventDefault(); }
  if (k==='m' && !e.repeat) showMini = !showMini;
  if (k==='e' || k==='enter' || k===' ') {
    e.preventDefault();
    if (k===' ' && mode==='walk') return;
    if (!e.repeat) action();
  }
  if (k==='escape' && mode==='mini') quitMini();
  if (k==='escape' && mode==='sport') quitSport();
});

const MV = {c1:[180,128], c2:[218,122], c3:[236,150], c4:[216,178], c5:[184,178], c6:[166,152],

const MAP_W = 400, MAP_H = 470, TRAY_Y = 400, THUMB = 0.3;
let mp = null;
function startMapa() {
  mp = {order: shuffle(REGIONS.map((_, i) => i)), placed: {}, sel: null, drag: null, msg: '', bad: false};
  mode = 'mapa'; ov.onclick = null;

    <canvas id="mapCv" width="${MAP_W}" height="${MAP_H}" class="paper" style="max-width:${MAP_W}px;background:#eaf2f6;border-color:#2c4a5a;touch-action:none"></canvas>

    <div class="dots" id="mapDots">${REGIONS.map(() => '<i></i>').join('')}</div>
    <p class="hint">Arraste as peças ou clique na peça e depois no lugar. Esc para sair.</p></div>`;
  ov.hidden = false;
  const cv = $('mapCv');

function ambPos(o) {
  const t = clock + o.off;
  if (o.at) return [o.at[0], o.at[1], false];
  if (o.circle) { const {c, r, f} = o.circle; return [c[0] + r*Math.cos(t*f), c[1] + r*Math.sin(t*f), true]; }
  if (o.orbit) { const {c, r, f} = o.orbit; return [c[0] + r[0]*Math.sin(t*f[0]), c[1] + r[1]*Math.sin(t*f[1] + 1.3), true]; }
  if (o.drive) { const [x0, y0] = o.drive.from, [x1, y1] = o.drive.to, len = Math.hypot(x1-x0, y1-y0), k = (t*o.drive.v % len)/len; return [x0 + (x1-x0)*k, y0 + (y1-y0)*k, true]; }
  if (!o.len) o.len = pathLen(o.path);
  if (o.loop) return [...pathAt(o.path, t*o.v % o.len), true];
  const walk = o.len/o.v, p = o.pause || 0, u = t % (2*(walk + p));
  if (u < p) return [...o.path[0], false];
  if (u < p + walk) return [...pathAt(o.path, (u - p)*o.v), true];
  if (u < 2*p + walk) return [...o.path[o.path.length-1], false];
  return [...pathAt(o.path, o.len - (u - 2*p - walk)*o.v), true];
}

// The desktop page has a "Tela cheia" button (and the F key): the HUD and map fill the screen, using the browser's full screen when it allows
(() => {
  const btn = document.getElementById('maxBtn'), stage = document.querySelector('.stage');
  if (!btn || !stage) return;
  const d = document, el = d.documentElement;
  const fit = () => {
    if (!d.body.classList.contains('max')) return window.__resizeGame(960, 640);
    const r = stage.getBoundingClientRect();
    if (r.width && r.height) window.__resizeGame(Math.round(r.width), Math.round(r.height));
  };
  const setMax = on => {
    d.body.classList.toggle('max', on);
    btn.textContent = on ? '✕ Sair da tela cheia' : '⛶ Tela cheia';
    btn.setAttribute('aria-pressed', on);
    requestAnimationFrame(fit);
  };
  const isFs = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  const toggle = () => {
    if (d.body.classList.contains('max')) { if (isFs()) (d.exitFullscreen || d.webkitExitFullscreen).call(d); setMax(false); return; }
    setMax(true);
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) try { Promise.resolve(req.call(el)).catch(() => {}); } catch (e) {}
  };
  btn.addEventListener('click', () => { toggle(); btn.blur(); });
  addEventListener('keydown', e => {
    if ((e.key === 'f' || e.key === 'F') && !e.repeat && mode === 'walk' && !/INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) toggle();
  });
  // leaving the browser's full screen with Esc also leaves the maximized layout
  const onFs = () => { if (!isFs() && d.body.classList.contains('max')) setMax(false); else requestAnimationFrame(fit); };
  d.addEventListener('fullscreenchange', onFs); d.addEventListener('webkitfullscreenchange', onFs);
  addEventListener('resize', fit);
})();

// ---------- Loop ----------
let lastArea = '';
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - t0)/1000)); t0 = now; clock += dt;
  let moving = false;
  if (mode === 'walk') {
    const sp = 150*dt;
    let dx = (keys.d?1:0) - (keys.a?1:0), dy = (keys.s?1:0) - (keys.w?1:0);
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    if (dx || dy) { move(dx*sp, dy*sp); moving = true; player.step += dt; followTrail(); }
    near = findNear();
    if (state.geo === 2 && level.id === 'baixo' && player.x/TS > G(1) && player.x/TS < G(14) && player.y/TS < 16.5) arriveLeitura();   // the room and its L wing
    if (state.gal === 1 && level.id === 'baixo' && player.x/TS > G(5) && player.x/TS < G(15) && player.y/TS > 125.3) arrivePap();
  } else if (mode === 'fila') {
    queueWalk(dt);
  } else if (mode === 'pong' && pg) {
    pongUpdate(dt);
  } else if (mode === 'sport' && sp) {
    sportUpdate(dt);
  } else if (mode === 'mini' && mg) {
    mg.pos += mg.dirn * mg.g.speed * dt;
    if (mg.pos > 1) { mg.pos = 1; mg.dirn = -1; } if (mg.pos < 0) { mg.pos = 0; mg.dirn = 1; }
    renderMini();
  }
  updateClassWalk(dt);
  updateLunch(dt);
  const WW = level.cols*TS, WH = level.rows*TS, vw = VW/ZOOM, vh = VH/ZOOM;
  const camX = Math.max(0, Math.min(WW - vw, player.x - vw/2));
  const camY = Math.max(0, Math.min(WH - vh, player.y - vh/2));
  Object.assign(cam, {x:camX, y:camY, w:vw, h:vh});
  ctx.fillStyle = '#0b0f15'; ctx.fillRect(0,0,VW,VH);
  const sw = Math.min(vw, WW), sh = Math.min(vh, WH);
  ctx.drawImage(level.bg, camX, camY, sw, sh, 0, 0, sw*ZOOM, sh*ZOOM);
  ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(-camX, -camY);
  level.doors.forEach(drawDoor);
  for (const id of ORDER) if (state.unlocked[id] && level.spots[id]) drawSpot(id);
  drawAmbient();
  for (const n of level.npcs) if (!(n.hide && n.hide())) drawPerson(n.pos[0]*TS, n.pos[1]*TS, n.shirt, false, n.hair);
  drawClass();
  drawCaderno();
  if (followerKind() === 'colega') { const c = companionPos(); drawPerson(c.x, c.y, LIVIA_SHIRT, moving, 'long'); }
  if (state.gal === 1) { const c = trail.length > 19 ? trail[trail.length-20] : (trail[0] ? {x:trail[0].x+14, y:trail[0].y+6} : {x:player.x+16, y:player.y+4}); drawPerson(c.x, c.y, GAL_SHIRT, moving, 'long'); }
  if (state.gal >= 2 && level.id === 'baixo') { drawPerson(G(8.5)*TS, 125.8*TS, GAL_SHIRT, false, 'long'); if (state.gal === 2) drawPerson(G(6.8)*TS, 127.4*TS, LIVIA_SHIRT, false, 'long'); }
  if (state.gal === 3) for (const it of ITENS) if (!state.itens[it.id] && it.lv === level.id) drawItem(it);
  if (followerKind() === 'cad') { const c = companionPos(); drawWheelchair(c.x, c.y); }
  if (state.cad === 3 && state.cadTable && level.id === 'baixo' && !state.recessOver) drawWheelchair(state.cadTable[0]*TS, state.cadTable[1]*TS);
  if (state.cad === 0 && state.recreio && !state.recessOver && level.id === 'baixo') drawWheelchair(G(20.5)*TS, 118.5*TS);
  drawLunch();
  drawEndOfDay();
  drawPerson(player.x, player.y, '#f4f4f4', moving || (mode === 'fila' && lunch.pm));
  if (state.almoco === 2) drawPlate(player.x + 9, player.y - 1);
  ctx.restore();
  const bx = (player.x - camX)*ZOOM, by = (player.y - camY)*ZOOM - 28;
  if (mode === 'walk' && near) bubble(nearLabel(), bx, by);
  if (mode === 'fila') bubble(queueLabel(), bx, by);
  if (showMini) {
    const mini = level.mini, mx = VW - mini.width - 10, my = 10, h = Math.min(mini.height, VH - 20);
    const ms = level.ms, sy = Math.max(0, Math.min(mini.height - h, player.y*ms - h/2));
    ctx.fillStyle='rgba(10,14,22,.75)'; ctx.fillRect(mx-4, my-4, mini.width+8, h+8);
    ctx.drawImage(mini, 0, sy, mini.width, h, mx, my, mini.width, h);
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1; ctx.strokeRect(mx + camX*ms, my + camY*ms - sy, vw*ms, vh*ms);
    ctx.fillStyle='#f2c14e'; ctx.beginPath(); ctx.arc(mx + player.x*ms, my + player.y*ms - sy, 3.5, 0, 7); ctx.fill();
    ctx.font='700 11px "Pixelify Sans", monospace'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#eef1f6';
    ctx.fillText(level.name.toUpperCase(), mx + mini.width/2, my + h + 6);
  }
  const area = currentArea() + level.id;
  if (area !== lastArea) { lastArea = area; updateHud(); }
  requestAnimationFrame(frame);
}

drawAll(); updateHud();
document.fonts && document.fonts.ready.then(drawAll);
requestAnimationFrame(frame);
})();
</script>

<script>
if (window.__LAYOUT !== 'computador') (() => {
  const $ = id => document.getElementById(id), stage = document.querySelector('.stage');
  // the map canvas always matches the space it has, so nothing is stretched
  const fit = () => { const r = stage.getBoundingClientRect(); if (r.width && r.height && window.__resizeGame) window.__resizeGame(Math.round(r.width), Math.round(r.height)); };
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
  document.addEventListener('fullscreenchange', () => setTimeout(fit, 100)); document.addEventListener('webkitfullscreenchange', () => setTimeout(fit, 100));
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  fit();

  let toastT = 0;
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4500); };
  $('fsBtn').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) return (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return toast('Este aparelho não deixa abrir em tela cheia pelo navegador. No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".');
    Promise.resolve(req.call(el)).then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock(screen.orientation.type).catch(() => {}); } catch (e) {} })
      .catch(() => toast('Não foi possível abrir em tela cheia aqui. Abra o jogo direto no navegador e tente de novo.'));
  });
  $('miniBtn').addEventListener('click', () => window.__toggleMini && window.__toggleMini());
  $('menuBtn').addEventListener('click', () => { $('menu').hidden = !$('menu').hidden; });
  $('menuClose').addEventListener('click', () => { $('menu').hidden = true; });
  $('escBtn').addEventListener('click', () => dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape'})));
  // the Sair button only shows inside a minigame
  const GAMES = ['mini','sport','pong','word','draw','fig','quiz','color','mol','mapa','form'];
  setInterval(() => { const m = window.__gameMode ? window.__gameMode() : 'walk'; $('escBtn').hidden = !GAMES.includes(m); }, 200);
  // pressed look on the touch buttons
  document.querySelectorAll('.pad button, .act').forEach(b => {
    b.addEventListener('pointerdown', () => b.classList.add('on'));
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => b.classList.remove('on'));
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
